name: Terraform Stages and Health Check

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Run up to which stage?'
        type: choice
        options:
          - init
          - plan
          - apply
        default: plan
      project:
        description: 'Project name'
        type: string
        default: demo
      environment:
        description: 'Environment'
        type: choice
        options:
          - dev
          - test
          - prod
        default: dev
 # schedule:
  #  - cron: '0 */6 * * *'   # timer: every 6 hours (UTC)

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  TF_ENV: ${{ inputs.environment || 'dev' }}  
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
  TF_VAR_project: ${{ inputs.project || 'demo' }}
  TF_VAR_environment: ${{ inputs.environment || 'dev' }}

jobs:
  init:
    name: 1 - Init, Format, Validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::954935267955:role/Terraform_Pipeline_Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false -backend-config="key=vpc-rds/${TF_ENV}/terraform.tfstate"

      - name: Validate
        run: terraform validate

  plan:
    name: 2 - Plan
    needs: init
    if: inputs.stage == 'plan' || inputs.stage == 'apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::954935267955:role/Terraform_Pipeline_Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false -backend-config="key=vpc-rds/${TF_ENV}/terraform.tfstate"

      - name: Plan
        run: terraform plan -input=false

  apply:
    name: 3 - Apply
    needs: plan
    if: inputs.stage == 'apply'
    runs-on: ubuntu-latest
    environment: production   # waits for approval
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::954935267955:role/Terraform_Pipeline_Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false -backend-config="key=vpc-rds/${TF_ENV}/terraform.tfstate"

      - name: Apply
        run: terraform apply -auto-approve -input=false

  health:
    name: 4 - Health Check
    needs: apply
    # runs on the timer, and right after a successful apply
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'schedule' || needs.apply.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::954935267955:role/Terraform_Pipeline_Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false -backend-config="key=vpc-rds/${TF_ENV}/terraform.tfstate"

      - name: Show outputs and resources
        run: |
          {
            echo "## Terraform outputs"
            echo '```'
            terraform output
            echo '```'
            echo "## Resources in state"
            echo '```'
            terraform state list
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify resources in AWS
        run: |
          VPC_ID=$(terraform output -raw vpc_id)
          DB_ID=$(terraform show -json | jq -r '[.values.root_module.child_modules[]?.resources[]? | select(.type=="aws_db_instance") | .values.identifier][0] // empty')

          FAILED=0
          {
            echo "## AWS verification"
            echo "| Resource | Status |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          VPC_STATE=$(aws ec2 describe-vpcs --vpc-ids "$VPC_ID" --query 'Vpcs[0].State' --output text 2>/dev/null || echo "MISSING")
          echo "| VPC $VPC_ID | $VPC_STATE |" >> "$GITHUB_STEP_SUMMARY"
          [ "$VPC_STATE" = "available" ] || FAILED=1

          SUBNET_COUNT=$(aws ec2 describe-subnets --filters Name=vpc-id,Values="$VPC_ID" --query 'length(Subnets)' --output text 2>/dev/null || echo 0)
          echo "| Subnets (expected 3) | $SUBNET_COUNT found |" >> "$GITHUB_STEP_SUMMARY"
          [ "$SUBNET_COUNT" = "3" ] || FAILED=1

          DB_STATUS=$(aws rds describe-db-instances --db-instance-identifier "$DB_ID" --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null || echo "MISSING")
          echo "| RDS $DB_ID | $DB_STATUS |" >> "$GITHUB_STEP_SUMMARY"
          [ "$DB_STATUS" = "available" ] || FAILED=1

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more resources are missing or not healthy"
            exit 1
          fi

      - name: Check for drift (missing or changed resources)
        if: always()
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false
          CODE=$?
          set -e
          if [ "$CODE" -eq 2 ]; then
            echo "::error::Drift found: a resource is missing or was changed outside Terraform"
            exit 1
          elif [ "$CODE" -eq 1 ]; then
            echo "::error::Terraform plan failed"
            exit 1
          fi
          echo "Everything matches the code."
